# Workflow name shown in the GitHub "Actions" tab and on PR checks
name: CI

# Triggers: when this workflow runs
on:
  push:
    branches: [main]   # every push to main
  pull_request:        # every pull request (any branch -> main)

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history, so a key committed and later deleted is still caught
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fails the job if a password, private key or API token is found. Known non-secrets: .gitleaks.toml
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest   # fresh Ubuntu VM provided by GitHub

    # Run every `run:` command from inside frontend/
    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Clone the repo at the commit being tested
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Install Node.js and cache npm downloads between runs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Clean install exactly what package-lock.json specifies
      - name: Install dependencies
        run: npm ci

      # 4. Fail the job if ESLint reports errors
      - name: Lint
        run: npm run lint

      # 5. Fail the job if the Vite production build breaks
      - name: Build
        run: npm run build

  pwa:
    name: Frontend (PWA tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Same Node version and clean install as the frontend job
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only Chromium is needed; --with-deps adds its system libraries
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The tests need a production build. Build first so dist/ exists before the second test server
      # (serve-two-versions.mjs) starts; playwright.pwa.config.js rebuilds for vite preview as well.
      - name: Build
        run: npm run build

      - name: PWA tests
        run: npm run test:pwa
